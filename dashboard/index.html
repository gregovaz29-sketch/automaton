<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automaton Control</title><style>body{margin:0;background:#09111f;color:#e8edf7;font:16px system-ui;padding:24px}main{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#18304b;padding:7px 10px;border-radius:99px;color:#83d8ff}.card{background:#111d30;border:1px solid #243653;border-radius:14px;padding:20px;margin:18px 0}h1,h2{margin-top:0}button{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;margin:4px}.ok{background:#48d597}.no{background:#ff8d8d}.pause{background:#ffd166}.next{background:#8bbcff}.clear{background:#9aa8bc}.log{line-height:1.9;color:#b8c7df}.pending{border-left:4px solid #ffd166}.hidden{display:none}</style><main><div class="top"><div><h1>Automaton Control</h1><p>Actividad, propuestas y permisos.</p></div><span class="badge">MODO SEGURO</span></div><section class="card"><h2>Estado</h2><p id="state">En pausa. No hay conexión externa.</p><button class="pause" id="pause">Mantener en pausa</button><button class="next" id="new">Generar propuesta de prueba</button></section><section class="card pending hidden" id="request"><h2>Permiso pendiente</h2><p id="action"></p><p id="risk"></p><button class="ok" id="approve">Aprobar</button><button class="no" id="reject">Rechazar</button></section><section class="card"><h2>Actividad</h2><button class="clear" id="clear">Limpiar registro</button><div class="log" id="log"></div></section></main><script>const proposals=[['Leer una nota local de prueba','Riesgo bajo. La demo no accede a archivos.'],['Enviar un resumen a una API externa','Riesgo alto. La demo bloquea la red.'],['Actualizar una tarea del dashboard','Riesgo medio. La demo no escribe datos.']];let i=0;const $=s=>document.querySelector(s),log=$('#log'),state=$('#state'),req=$('#request'),key='automaton-safe-dashboard-log';let events=JSON.parse(localStorage.getItem(key)||'[]');function render(){log.innerHTML=events.map(x=>'• '+x).join('<br>')}function add(t){events.push(t);localStorage.setItem(key,JSON.stringify(events));render()}function show(){const p=proposals[i++%proposals.length];$('#action').innerHTML='<b>Acción propuesta:</b> '+p[0];$('#risk').textContent=p[1];req.classList.remove('hidden');state.textContent='Esperando tu decisión. Automaton sigue en pausa.';add('Nueva propuesta local creada.')}if(!events.length)add('Panel iniciado en modo seguro. Ninguna orden enviada a Automaton.');else render();$('#new').onclick=show;$('#approve').onclick=()=>{add('Aprobada por la persona. La demo la registra, no la ejecuta.');state.textContent='Aprobación registrada. Sin actividad externa.';req.classList.add('hidden')};$('#reject').onclick=()=>{add('Rechazada por la persona.');state.textContent='Acción cancelada.';req.classList.add('hidden')};$('#pause').onclick=()=>{add('Pausa confirmada.');state.textContent='En pausa. Sin actividad externa.'};$('#clear').onclick=()=>{events=[];localStorage.removeItem(key);add('Registro reiniciado en modo seguro.')}</script>
